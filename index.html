<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <button class="top-btn" id="prevBtn">◀</button>
  <div class="main-title" id="titleText">时间单位</div>
  <button class="top-btn" id="nextBtn">▶</button>
  <div class="menu" id="catMenu">
    <div class="menu-item" data-type="time">时间单位</div>
    <div class="menu-item" data-type="length">长度单位</div>
    <div class="menu-item" data-type="ts">时间戳↔日期</div>
    <div class="menu-item" data-type="json">JSON格式化</div>
  </div>
</div>

<div class="convert-wrap">
  <div class="side">
    <div class="unit-label">单位</div>
    <input type="number" class="input-box" id="leftVal" placeholder="输入数值">
    <div class="custom-select" id="leftUnit">
      <div class="custom-select-trigger"></div>
      <div class="custom-select-options"></div>
    </div>
  </div>
  <div class="side">
    <div class="unit-label">单位</div>
    <input type="number" class="input-box" id="rightVal" placeholder="结果" readonly>
    <div class="custom-select" id="rightUnit">
      <div class="custom-select-trigger"></div>
      <div class="custom-select-options"></div>
    </div>
  </div>
</div>

<div class="convert-wrap hidden" id="tsWrap">
  <div class="side">
    <div class="unit-label">类型</div>
    <div class="ts-input-group">
      <input type="number" class="input-box" id="tsLeftNum" placeholder="时间戳">
      <input type="text" class="input-box hidden" id="tsLeftDate" placeholder="选择日期时间">
    </div>
    <div class="custom-select" id="tsLeftType">
      <div class="custom-select-trigger">时间戳</div>
      <div class="custom-select-options">
        <div class="custom-select-option selected" data-value="timestamp">时间戳</div>
        <div class="custom-select-option" data-value="datetime">日期时间</div>
      </div>
    </div>
  </div>
  <div class="side">
    <div class="unit-label">类型</div>
    <div class="ts-input-group">
      <input type="number" class="input-box" id="tsRightNum" readonly>
      <input type="text" class="input-box hidden" id="tsRightDate" readonly placeholder="转换结果">
    </div>
    <div class="custom-select" id="tsRightType">
      <div class="custom-select-trigger">日期时间</div>
      <div class="custom-select-options">
        <div class="custom-select-option selected" data-value="datetime">日期时间</div>
        <div class="custom-select-option" data-value="timestamp">时间戳</div>
      </div>
    </div>
  </div>
</div>

<div class="json-wrap hidden" id="jsonWrap">
  <div class="side">
    <div class="unit-label">输入JSON</div>
    <textarea class="json-textarea" id="jsonInput" placeholder='粘贴JSON字符串，例如：{"name":"测试","age":18}'></textarea>
  </div>
  <div class="side">
    <div class="unit-label">格式化结果</div>
    <textarea class="json-textarea" id="jsonOutput" readonly placeholder="格式化后的JSON"></textarea>
    <div class="json-btn-group">
      <button class="json-btn" id="formatBtn">格式化JSON</button>
      <button class="json-btn secondary" id="copyBtn">一键复制</button>
      <button class="json-btn secondary" id="minifyBtn">压缩JSON</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
<script src="main.js"></script>
</body>
</html>
