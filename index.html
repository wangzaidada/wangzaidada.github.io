<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱</title>
<script>
(function(){
  var d = document.documentElement;
  var t = localStorage.getItem('theme');
  if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    d.classList.add('dark');
  }
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/air-datepicker@3/air-datepicker.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">工具箱</div>
  <nav class="sidebar-nav">
    <a class="sidebar-item active" data-section="section-time">时间单位</a>
    <a class="sidebar-item" data-section="section-length">长度单位</a>
    <a class="sidebar-item" data-section="section-ts">时间戳↔日期</a>
    <a class="sidebar-item" data-section="section-json">JSON格式化</a>
  </nav>
  <div class="sidebar-bottom">
    <button class="sidebar-theme-btn" id="sidebarThemeToggle" title="切换主题">
      <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
        <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
        <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
        <path d="m2 2 20 20"/>
      </svg>
    </button>
  </div>
</aside>

<main class="content" id="mainContent">

<div class="top-bar">
  <button class="top-btn" id="prevBtn">&#9664;</button>
  <div class="main-title" id="titleText">时间单位</div>
  <button class="top-btn" id="nextBtn">&#9654;</button>
  <div class="menu" id="catMenu">
    <div class="menu-item" data-type="time">时间单位</div>
    <div class="menu-item" data-type="length">长度单位</div>
    <div class="menu-item" data-type="ts">时间戳↔日期</div>
    <div class="menu-item" data-type="json">JSON格式化</div>
  </div>
</div>

<section class="tool-section" id="section-time">
  <h2 class="section-title">时间单位</h2>
  <div class="convert-wrap" id="timeWrap">
    <div class="side">
      <div class="unit-label">单位</div>
      <input type="number" class="input-box" id="leftVal" placeholder="输入数值">
      <div class="custom-select" id="leftUnit">
        <div class="custom-select-trigger"></div>
        <div class="custom-select-options"></div>
      </div>
    </div>
    <div class="side">
      <div class="unit-label">单位</div>
      <input type="number" class="input-box" id="rightVal" placeholder="结果" readonly>
      <div class="custom-select" id="rightUnit">
        <div class="custom-select-trigger"></div>
        <div class="custom-select-options"></div>
      </div>
    </div>
  </div>
</section>

<section class="tool-section" id="section-length">
  <h2 class="section-title">长度单位</h2>
  <div class="convert-wrap" id="lengthWrap">
    <div class="side">
      <div class="unit-label">单位</div>
      <input type="number" class="input-box" id="leftVal2" placeholder="输入数值">
      <div class="custom-select" id="leftUnit2">
        <div class="custom-select-trigger"></div>
        <div class="custom-select-options"></div>
      </div>
    </div>
    <div class="side">
      <div class="unit-label">单位</div>
      <input type="number" class="input-box" id="rightVal2" placeholder="结果" readonly>
      <div class="custom-select" id="rightUnit2">
        <div class="custom-select-trigger"></div>
        <div class="custom-select-options"></div>
      </div>
    </div>
  </div>
</section>

<section class="tool-section" id="section-ts">
  <h2 class="section-title">时间戳 &#8596; 日期</h2>
  <div class="convert-wrap" id="tsWrap">
    <div class="side">
      <div class="unit-label">类型</div>
      <div class="ts-input-group">
        <input type="number" class="input-box" id="tsLeftNum" placeholder="时间戳">
        <input type="text" class="input-box hidden" id="tsLeftDate" placeholder="选择日期时间">
      </div>
      <div class="custom-select" id="tsLeftType">
        <div class="custom-select-trigger">时间戳</div>
        <div class="custom-select-options">
          <div class="custom-select-option selected" data-value="timestamp">时间戳</div>
          <div class="custom-select-option" data-value="datetime">日期时间</div>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="unit-label">类型</div>
      <div class="ts-input-group">
        <input type="number" class="input-box" id="tsRightNum" readonly>
        <input type="text" class="input-box hidden" id="tsRightDate" readonly placeholder="转换结果">
      </div>
      <div class="custom-select" id="tsRightType">
        <div class="custom-select-trigger">日期时间</div>
        <div class="custom-select-options">
          <div class="custom-select-option selected" data-value="datetime">日期时间</div>
          <div class="custom-select-option" data-value="timestamp">时间戳</div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="tool-section" id="section-json">
  <h2 class="section-title">JSON格式化</h2>
  <div class="json-wrap" id="jsonWrap">
    <div class="side">
      <div class="unit-label">输入JSON</div>
      <textarea class="json-textarea" id="jsonInput" placeholder='粘贴JSON字符串，例如：{"name":"测试","age":18}'></textarea>
    </div>
    <div class="side">
      <div class="unit-label">格式化结果</div>
      <div class="json-view" id="jsonOutput"></div>
      <div class="json-btn-group">
        <button class="json-btn" id="formatBtn">格式化JSON</button>
        <button class="json-btn secondary" id="escapeBtn">转义</button>
        <button class="json-btn secondary" id="unescapeBtn">去转义</button>
        <button class="json-btn secondary" id="copyBtn">一键复制</button>
        <button class="json-btn secondary" id="minifyBtn">压缩JSON</button>
      </div>
    </div>
  </div>
</section>

</main>

<div class="float-nav" id="floatNav">
  <button class="float-btn theme-toggle" id="themeToggle" title="切换日间/夜间模式">
    <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
      <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
      <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
      <path d="m2 2 20 20"/>
    </svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/air-datepicker@3/air-datepicker.min.js"></script>
<script src="main.js"></script>
</body>
</html>
